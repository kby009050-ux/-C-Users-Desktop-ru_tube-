name: 루사연 음성 실제 발화 점검
on:
  push:
    paths:
      - automation/audio_audit_trigger.txt
permissions:
  contents: read
  actions: read
jobs:
  speech-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Gemini Python SDK
        run: python -m pip install google-genai
      - name: Retrieve produced voice recording
        run: |
          mkdir -p audio_audit_files
          gh run download 44364155756 --repo "${{ github.repository }}" --name "ru-sayeon-gemini-shorts" --dir audio_audit_files
          test -s audio_audit_files/ru_sayeon_voice.wav
      - name: Transcribe exact spoken words
        run: python automation/audio_audit.py audio_audit_files/ru_sayeon_voice.wav
